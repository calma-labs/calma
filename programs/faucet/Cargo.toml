[package]
name = "faucet"
version = "0.1.0"
description = "Test-only mint/burn faucet. Never deploy alongside a production calma pool."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "faucet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"
