name: Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: matzayonc/setup-anchor-from-anchor-lang@main
        with:
          anchor-version: '1.0.1'
          solana-cli-version: '3.1.14'
          node-version: '25.8.1'

      - name: Anchor build
        run: anchor build --ignore-keys

      - name: Install dependencies
        working-directory: app
        run: bun install

      - name: Build
        working-directory: app
        run: bun run build

      # Upload for GitHub Pages deployment
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      # Upload for Vercel deployment (reuses the same dist, no rebuild)
      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: app/dist

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create Vercel build output
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
