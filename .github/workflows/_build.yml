name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: matzayonc/setup-anchor-from-anchor-lang@main
        with:
          anchor-version: '1.0.2'
          solana-cli-version: '3.1.14'
          node-version: '25.8.1'

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Cache wasm-pack binary
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Anchor resolves every program declared in Anchor.toml before it builds.
      # Keep this list in sync with [programs.localnet] there — a missing entry
      # fails the build, and an entry for a program that does not exist (there
      # was a `jbl` here once) silently produces a stray artifact.
      - name: Prepare deploy directory with placeholder .so files
        run: |
          mkdir -p target/deploy
          for prog in calma faucet feed guard irm quote; do
            touch target/deploy/${prog}.so
          done

      - name: Anchor build
        run: anchor build --ignore-keys

      # Must run after `anchor build`: the LiteSVM integration tests under
      # programs/*/tests `include_bytes!` the real target/deploy/*.so, so they
      # would compile against the empty placeholders above if run any earlier.
      # This covers the crate unit tests and the LiteSVM tests in one pass;
      # `deploy-vercel` needs this job, so a red test blocks the deploy.
      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build wasm package
        run: npm run wasm

      - name: Cache app node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install dependencies
        working-directory: app
        run: npm i

      - name: Build for Vercel (base /app/)
        working-directory: app
        run: npm run build -- --base=/app/

      - name: Assemble Vercel output
        run: |
          mkdir -p vercel-output/app
          cp -r app/dist/. vercel-output/app/
          cp -r landing/. vercel-output/

      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: vercel-output
          include-hidden-files: true
