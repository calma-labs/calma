[package]
name = "jbl-math-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jbl-math = { path = "../jbl-math" }
jbl-state = { path = "../jbl-state" }
wasm-bindgen = "0.2"
bytemuck = "1.14"

[dev-dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
wasmtime = "28"
